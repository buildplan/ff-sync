name: Docker

on:
  workflow_dispatch:
    inputs:
      build_platforms:
        description: 'Platforms to build'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: choice
        options:
          - linux/amd64
          - linux/arm64
          - linux/amd64,linux/arm64
  push:
    branches:
      - "main"
      - "dev"
    tags:
      - 'v*.*.*'
    # Only run on changes to files that affect the Docker image
    paths:
      - 'app/**'
      - 'data/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-publish.yml'
    # Ignore documentation and configuration changes
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'example.env'
      - 'LICENSE'
  pull_request:
    branches:
      - "main"
    # Only run on changes to files that affect the Docker image
    paths:
      - 'app/**'
      - 'data/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-publish.yml'
    # Ignore documentation and configuration changes
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'example.env'
      - 'LICENSE'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Check if files that affect build have changed
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for meaningful changes
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f418ce2de6497
        with:
          filters: |
            docker:
              - 'app/**'
              - 'data/**'
              - 'docker-compose.yml'
              - '.github/workflows/docker-publish.yml'

  build:
    needs: changes
    # Skip build if only documentation changed
    if: needs.changes.outputs.docker == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20
        with:
          cosign-release: 'v2.2.4'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09
        with:
          context: app
          platforms: ${{ github.event.inputs.build_platforms || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
